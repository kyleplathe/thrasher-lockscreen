# Fetch new Thrasher covers, generate optimized + text overlays, commit if anything changed.
# Schedule: 1st of each month 14:00 UTC (~morning US). Edit cron below to taste.
name: Monthly Thrasher cover

on:
  schedule:
    - cron: "0 14 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-thrasher-cover
  cancel-in-progress: false

jobs:
  update-covers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape new covers
        run: python3 scripts/monthly_cover_scraper.py

      - name: Process only newly downloaded originals
        run: |
          set -euo pipefail
          mkdir -p images/original images/optimized_final_with_text
          mapfile -t new_originals < <(
            git status --porcelain -- images/original/*.jpg \
              | awk '{print $2}'
          )

          if [[ ${#new_originals[@]} -eq 0 ]]; then
            echo "No new originals to process."
            exit 0
          fi

          for f in "${new_originals[@]}"; do
            base=$(basename "$f")
            echo "Processing $base ..."
            python3 scripts/process_single_cover.py "$base"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/original images/optimized_final_with_text shortcuts_text_overlay_covers.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: monthly Thrasher cover update"
            git push
          fi
