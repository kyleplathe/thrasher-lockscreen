# One-shot connectivity check. Push to the fix branch sends a single test message
# using the repo Resend secrets, then this file is removed.
name: Send test cover email

on:
  push:
    branches: [cursor/fix-resend-cloudflare-92af]

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Send test email for the latest cover
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SEND_TEST_EMAIL: "1"
        run: python3 scripts/send_new_cover_email.py
