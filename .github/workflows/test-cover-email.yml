# One-shot check that the cover image arrives inline. Removed after the send.
name: Send test cover email

on:
  push:
    branches: [cursor/fix-resend-cloudflare-92af]

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Send test email with the latest cover image
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SEND_TEST_EMAIL: "1"
        run: python3 scripts/send_new_cover_email.py
