# Fetch new Thrasher covers, generate optimized + text overlays, commit if anything changed.
# Schedule: 4×/month (1st, 8th, 15th, 22nd) 14:00 UTC — covers often land mid-month; runs are cheap and idempotent.
# Edit crons below or add workflow_dispatch for a manual check.
name: Monthly Thrasher cover

on:
  schedule:
    - cron: "0 14 1 * *"
    - cron: "0 14 8 * *"
    - cron: "0 14 15 * *"
    - cron: "0 14 22 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-thrasher-cover
  cancel-in-progress: false

jobs:
  update-covers:
    runs-on: ubuntu-latest
    # Use Node 24 for JS-based actions (checkout/setup-python) — avoids Node 20 deprecation warnings.
    # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install fonts for text overlays
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Scrape new covers
        run: python3 scripts/monthly_cover_scraper.py

      - name: Process only newly downloaded originals
        run: |
          set -euo pipefail
          mkdir -p images/original images/optimized_final_with_text
          shopt -s nullglob
          paths=(images/original/*.jpg)
          if [[ ${#paths[@]} -eq 0 ]]; then
            echo "No JPGs in images/original yet."
            exit 0
          fi
          mapfile -t new_originals < <(
            git status --porcelain -- "${paths[@]}" | awk '{print $2}'
          )

          if [[ ${#new_originals[@]} -eq 0 ]]; then
            echo "No new originals to process."
            exit 0
          fi

          for f in "${new_originals[@]}"; do
            base=$(basename "$f")
            echo "Processing $base ..."
            python3 scripts/process_single_cover.py "$base"
          done

      - name: Commit and push
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF#refs/heads/}"

          # Do NOT `git add` missing paths — `git add missing-file` exits 128 (fatal pathspec).
          git add images/original images/optimized_final_with_text shortcuts_text_overlay_covers.json
          [[ -f data/cover_shop_publish_timestamps.json ]] && git add data/cover_shop_publish_timestamps.json
          [[ -f data/cover_first_seen.json ]] && git add data/cover_first_seen.json

          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          else
            git commit -m "chore: monthly Thrasher cover update"
            git fetch origin "$BRANCH"
            git rebase "origin/${BRANCH}"
            git push origin "HEAD:${BRANCH}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Optional: Resend API + NOTIFY_EMAIL secret — see scripts/AUTOMATION_SETUP.md
      - name: Notify email (Resend)
        if: success() && steps.commit.outputs.changed == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python3 scripts/send_new_cover_email.py

      # Optional: install ntfy app (iOS/Android), pick a topic, add repo secret NTFY_TOPIC — see scripts/AUTOMATION_SETUP.md
      - name: Notify phone (ntfy.sh)
        if: success() && steps.commit.outputs.changed == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          if [ -z "${NTFY_TOPIC}" ]; then
            echo "No NTFY_TOPIC secret — skipping push notification (optional)."
            exit 0
          fi
          TITLE="Thrasher lock screen: new cover"
          BODY="$(git log -1 --oneline)"
          FILES="$(git diff-tree --no-commit-id --name-only -r HEAD | tr '\n' ' ')"
          MSG="${BODY}"$'\n'"${FILES}"
          if [ -n "${NTFY_TOKEN}" ]; then
            curl -fsS \
              -H "Authorization: Bearer ${NTFY_TOKEN}" \
              -H "Title: ${TITLE}" \
              -H "Tags: magazine,skateboard" \
              -d "${MSG}" \
              "https://ntfy.sh/${NTFY_TOPIC}"
          else
            curl -fsS \
              -H "Title: ${TITLE}" \
              -H "Tags: magazine,skateboard" \
              -d "${MSG}" \
              "https://ntfy.sh/${NTFY_TOPIC}"
          fi
          echo "Push notification sent."
